<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tower Defense</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="hud">
      <h1>Tower Defense</h1>
      <p>Score: <span id="score">0</span></p>
      <p>Health: <span id="health">100</span>%</p>
      <p>Wave: <span id="wave">1</span></p>
      <p class="hint">WASD / Arrow Keys to move cursor • Space / Click to place turret</p>
    </div>

    <div id="overlay">
      <div class="card">
        <h2>Defend the Island</h2>
        <p>
          Place turrets to stop the enemy drones from reaching your base.
          Survive as many waves as possible.
        </p>
        <button id="startBtn">Start Defense</button>
      </div>
    </div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
