<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Typhoon Tycoon 2.5D - Manus Edition</title>
    <link rel="stylesheet" href="style.css">
