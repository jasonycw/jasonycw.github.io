<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Typhoon Tycoon 2.5D - Superior Edition</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
            <div id="hud">
                <div class="hud-item">
                    <span class="label">YEAR</span>
                    <span id="wave-count" class="value">0</span>
                </div>
                <div class="hud-item">
                    <span class="label">HSI</span>
                    <span id="money-count" class="value">1500</span>
                </div>
                <div class="hud-item">
                    <span class="label">LIVES</span>
                    <span id="lives-count" class="value">10</span>
                </div>
                <div class="hud-item power-container">
                    <span class="label">POWER</span>
                    <div class="power-bar">
                        <div id="power-fill" class="power-fill"></div>
                    </div>
                </div>
            </div>

            <div id="game-status-container">
                <h2 id="game-status">READY TO DEFEND?</h2>
                <button id="start-button" class="main-btn">START DEFENSE</button>
            </div>

            <div id="tower-toolbar">
                <!-- Buttons will be injected here -->
            </div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
