<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typhoon Tycoon - 2.5D Tower Defense</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="ui-overlay">
            <div id="top-ui">
                <div class="stat wave">Wave: <span id="wave-count">1</span> / 5</div>
                <div class="stat money">Money: <span id="money">500</span></div>
                <div class="stat lives">Lives: <span id="lives">20</span></div>
            </div>
            <div id="tower-info" class="hidden">
                <div id="tower-name">Tower</div>
                <div id="tower-cost">Cost: 100</div>
                <button id="place-tower-btn">Place Tower</button>
            </div>
            <div id="start-screen" class="hidden">
                <div id="start-title">TYPHOON TYCOON</div>
                <div id="start-subtitle">2.5D Tower Defense</div>
                <div id="start-instructions">
                    <p>Click on the map to place towers</p>
                    <p>Defend against incoming typhoons!</p>
                </div>
                <button id="start-btn">START GAME</button>
            </div>
            <div id="game-state" class="hidden">
                <div id="state-message">Game Over</div>
                <button id="restart-btn">Restart Game</button>
            </div>
            <div id="debug-info" class="debug">
                <span>FPS: <span id="fps">60</span></span>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@r128/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@r128/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
