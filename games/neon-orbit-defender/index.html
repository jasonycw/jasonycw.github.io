<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Orbit Defender</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="hud">
      <h1>Neon Orbit Defender</h1>
      <p>
        Move: <strong>WASD / Arrow Keys</strong> · Aim: <strong>Mouse</strong> · Shoot:
        <strong>Left Click</strong>
      </p>
      <p>Score: <span id="score">0</span> · Health: <span id="health">100</span></p>
      <p id="message">Defend the core for 90 seconds.</p>
      <button id="restart" hidden>Play Again</button>
    </div>
    <canvas id="game-canvas"></canvas>

    <script type="module" src="./main.js"></script>
  </body>
</html>
