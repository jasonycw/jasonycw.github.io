<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Jump</title>
    <link rel="icon" type="image/x-icon" href="../../img/favicon.ico" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="hud">
      <h1>SKY JUMP</h1>
      <p>Level: <span id="level">1</span></p>
      <p>Score: <span id="score">0</span></p>
      <p>Stars: <span id="stars">0</span></p>
      <p class="hint">WASD to move • Space to jump • Land on a different island to collect a star</p>
    </div>

    <div id="overlay">
      <div class="card">
        <h2>Floating Platforms</h2>
        <p>
          Navigate through the sky islands while avoiding deadly voids.
          Land on different islands 5 times to progress.
        </p>
        <button id="startBtn" type="button">Start Adventure</button>
      </div>
    </div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
