<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games - Jason Yu</title>
  <link rel="icon" type="image/x-icon" href="../img/favicon.ico" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* Game card container - positioned absolutely for DVD screensaver effect */
    .game-card {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
     width: 14vw;
     aspect-ratio: 4 / 3;
     min-width: 100px;
     min-height: 75px;
     padding: 0;
     transition: color 0.05s ease;
     will-change: transform, left, top, color;
     -webkit-font-smoothing: antialiased;
     -moz-osx-font-smoothing: grayscale;
    }

    /* Text inside cards scales to fit dimensions */
    .game-card h2 {
     font-size: 16px;
     font-weight: 700;
     margin: 0;
     padding: 0;
     line-height: 1;
     word-wrap: break-word;
     overflow-wrap: break-word;
     width: 100%;
     flex-shrink: 0;
    }

    .game-card p {
     font-size: 12px;
     opacity: 0.85;
     margin: 0;
     padding: 0;
     line-height: 1.1;
     word-wrap: break-word;
     overflow-wrap: break-word;
     width: 100%;
     flex-shrink: 1;
    }

    /* Ensure no overflow - text is clipped if needed (shouldn't happen with proper sizing) */
    .game-card-content {
     width: 100%;
     height: 100%;
     display: flex;
     flex-direction: column;
     align-items: center;
     justify-content: flex-start;
     overflow: hidden;
     padding: 0;
     margin: 0;
    }
  </style>
</head>
<body>
  <!-- Game cards will be inserted here by JavaScript -->

  <script>
    // ============================================================================
    // DVD Screensaver Games Page
    // ============================================================================
    // A single-file HTML page featuring a DVD screensaver-style animation where
    // game cards bounce around the viewport with dynamic color changes.
    //
    // Features:
    // - Bouncing cards with constant-velocity diagonal movement
    // - Random neon colors assigned to each card on initialization
    // - Color change on wall collisions (single-axis bounce)
    // - Rainbow flash effect on corner collisions (both-axes bounce)
    // - Responsive card sizing and viewport boundary adaptation
    // - Preserved click functionality to navigate to each game
    // - No external dependencies - pure vanilla JavaScript
    // - Smooth 60fps animation using requestAnimationFrame
    // ============================================================================

    // ============================================================================
    // Game Data - Extracted from original HTML
    // ============================================================================
    const GAMES = [
      {
        title: 'Blokus',
        subtitle: 'Classic abstract strategy board game with P2P multiplayer and AI',
        href: 'blokus/'
      },
      {
        title: 'Blokus Online',
        subtitle: 'Serverless WebRTC online multiplayer version of Blokus',
        href: 'blokus-online/'
      },
      {
        title: 'Cube Shooter',
        subtitle: 'Survive waves of cubes in this fast-paced arcade shooter',
        href: 'cube-shooter/'
      },
      {
        title: 'Fluid Go',
        subtitle: 'Experimental continuous-influence-field variant of Go',
        href: 'fluid-go/'
      },
      {
        title: 'Neon Orbit Defender',
        subtitle: 'Defend the power core from enemy shards in neon orbit',
        href: 'neon-orbit-defender/'
      },
      {
        title: 'Orbital Blitz',
        subtitle: 'Fast top-down survival shooter protecting a station ring',
        href: 'orbital-blitz/'
      },
      {
        title: 'Sky Jump',
        subtitle: 'Leap between floating islands and collect stars',
        href: 'sky-jump/'
      },
      {
        title: 'Tower Defense',
        subtitle: 'Place turrets and defend your base from enemy drones',
        href: 'tower-defense/'
      },
      {
        title: 'Typhoon Tycoon (by Copilot CLI)',
        subtitle: '2.5D tower defense with Three.js - No build steps required!',
        href: 'typhoon-tycoon-by-copilot-cli/'
      },
      {
        title: 'Typhoon Tycoon (by OpenRouter)',
        subtitle: 'Try to recreate 2.5D version of https://jasonycw.github.io/TyphoonTycoon/',
        href: 'typhoon-tycoon-by-openrouter-free/'
      }
    ];

    // ============================================================================
    // Neon Color Palette
    // ============================================================================
    const NEON_COLORS = [
      '#00FFFF', // Cyan
      '#FF00FF', // Magenta
      '#00FF00', // Lime
      '#FFFF00', // Yellow
      '#FF0080', // Hot Pink
      '#00FF80', // Spring Green
      '#FF8000', // Orange
      '#0080FF'  // Dodger Blue
    ];

    const RAINBOW_COLORS = [
      '#FF0000', // Red
      '#FF7F00', // Orange
      '#FFFF00', // Yellow
      '#00FF00', // Green
      '#00FFFF', // Cyan
      '#FF00FF'  // Magenta
    ];

    // ============================================================================
    // Utility Functions
    // ============================================================================

    /**
     * Get a random color from the neon palette
     */
    function getRandomNeonColor() {
      return NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
    }

    /**
     * Create the HTML for a game card
     */
    function createGameCardElement(game) {
      const card = document.createElement('a');
      card.className = 'game-card';
      card.href = game.href;
      card.innerHTML = `
        <div class="game-card-content">
          <h2>${game.title}</h2>
          <p>${game.subtitle}</p>
        </div>
      `;
      return card;
    }

    /**
     * Fit text within card boundaries by adjusting font size
     * 1. Title grows to fill width (100% width), 2. Subtitle fills remaining height
     */
    function fitTextToCard(cardElement) {
      const title = cardElement.querySelector('h2');
      const subtitle = cardElement.querySelector('p');
      
      if (!title || !subtitle) return;

      const cardHeight = cardElement.offsetHeight;
      const cardWidth = cardElement.offsetWidth;
      
      // Step 1: Grow title size until it fills the width
      let titleSize = 8; // Start small
      let prevTitleSize = 8;
      
      // Grow title size until it exceeds width, then use the largest that fits
      for (let i = 0; i < 50; i++) {
        title.style.fontSize = titleSize + 'px';
        // Force reflow to get accurate measurements
        const titleWidth = title.offsetWidth;
        const titleScrollWidth = title.scrollWidth;
        
        // If text exceeds card width, go back to previous size
        if (titleWidth > cardWidth || titleScrollWidth > cardWidth) {
          title.style.fontSize = prevTitleSize + 'px';
          titleSize = prevTitleSize;
          break;
        }
        
        prevTitleSize = titleSize;
        titleSize += 0.5; // Increment by 0.5px for precision
      }
      
      // Step 2: Get title's height and calculate remaining space
      const titleHeight = title.offsetHeight;
      const remainingHeight = cardHeight - titleHeight;
      
      // Step 3: Fit subtitle to remaining space - start large and shrink
      let subtitleSize = Math.max(8, remainingHeight * 0.8);
      
      // Shrink subtitle until it fits remaining height
      for (let i = 0; i < 50; i++) {
        subtitle.style.fontSize = subtitleSize + 'px';
        
        if (subtitle.offsetHeight <= remainingHeight) {
          break;
        }
        
        subtitleSize *= 0.95;
      }
    }

    // ============================================================================
    // Physics & Animation State Management
    // ============================================================================
    const cardStates = []; // Array of { element, x, y, vx, vy, color, isFlashing, rainbowIndex, width, height }
    let animationFrameId;
    let lastWidth = window.innerWidth;
    let lastHeight = window.innerHeight;

    /**
     * Initialize a card with position, velocity, and color
     */
    function initializeCardState(cardElement, index) {
      const width = cardElement.offsetWidth;
      const height = cardElement.offsetHeight;
      
      const state = {
        element: cardElement,
        x: Math.random() * (window.innerWidth - width),
        y: Math.random() * (window.innerHeight - height),
        vx: (Math.random() - 0.5) * 1.5 + (Math.random() > 0.5 ? 1 : -1),
        vy: (Math.random() - 0.5) * 1.5 + (Math.random() > 0.5 ? 1 : -1),
        color: getRandomNeonColor(),
        isFlashing: false,
        rainbowIndex: 0,
        rainbowCounter: 0,
        width: width,
        height: height
      };

      cardStates.push(state);
      applyCardStyle(state);
    }

    /**
     * Apply position and color styles to a card
     */
    function applyCardStyle(state) {
      state.element.style.left = state.x + 'px';
      state.element.style.top = state.y + 'px';
      state.element.style.color = state.isFlashing 
        ? RAINBOW_COLORS[state.rainbowIndex]
        : state.color;
    }

    /**
     * Update card dimensions (for responsive resizing)
     */
    function updateCardDimensions(state) {
      state.width = state.element.offsetWidth;
      state.height = state.element.offsetHeight;
    }

    /**
     * Check and handle collisions with window boundaries
     * Detects wall hits, corner hits, and applies appropriate collision responses
     */
    function handleBoundaryCollision(state) {
      const margin = 0;
      let hitXBoundary = false;
      let hitYBoundary = false;

      // Horizontal boundary check (left or right edge)
      if (state.x <= margin) {
        state.x = margin;
        state.vx = Math.abs(state.vx);
        hitXBoundary = true;
      } else if (state.x + state.width >= window.innerWidth - margin) {
        state.x = window.innerWidth - state.width - margin;
        state.vx = -Math.abs(state.vx);
        hitXBoundary = true;
      }

      // Vertical boundary check (top or bottom edge)
      if (state.y <= margin) {
        state.y = margin;
        state.vy = Math.abs(state.vy);
        hitYBoundary = true;
      } else if (state.y + state.height >= window.innerHeight - margin) {
        state.y = window.innerHeight - state.height - margin;
        state.vy = -Math.abs(state.vy);
        hitYBoundary = true;
      }

      // Determine collision type and apply effects
      if (hitXBoundary || hitYBoundary) {
        if (hitXBoundary && hitYBoundary) {
          // Corner hit - both X and Y boundaries hit in same frame
          state.isFlashing = true;
          state.rainbowIndex = 0;
          state.rainbowCounter = 0;
        } else {
          // Wall hit (not corner) - change to random neon color
          state.color = getRandomNeonColor();
          state.isFlashing = false;
        }
      }
    }

    /**
     * Update rainbow flash animation
     */
    function updateRainbowFlash(state) {
      if (state.isFlashing) {
        state.rainbowCounter++;
        if (state.rainbowCounter >= 10) {
          state.rainbowCounter = 0;
          state.rainbowIndex = (state.rainbowIndex + 1) % RAINBOW_COLORS.length;
        }
      }
    }

    /**
     * Animation loop - called every frame
     */
    function animateCards() {
      cardStates.forEach(state => {
        // Update position based on velocity
        state.x += state.vx;
        state.y += state.vy;

        // Handle boundary collisions
        handleBoundaryCollision(state);

        // Update rainbow flash if active
        updateRainbowFlash(state);

        // Apply styles
        applyCardStyle(state);
      });

      animationFrameId = requestAnimationFrame(animateCards);
    }

    // ============================================================================
    // Window Resize & Responsiveness
    // ============================================================================
    function handleWindowResize() {
      const newWidth = window.innerWidth;
      const newHeight = window.innerHeight;

      // Only update if dimensions actually changed
      if (newWidth !== lastWidth || newHeight !== lastHeight) {
        cardStates.forEach(state => {
          updateCardDimensions(state);
          
          // Clamp positions to new viewport
          if (state.x + state.width > newWidth) {
            state.x = newWidth - state.width;
          }
          if (state.y + state.height > newHeight) {
            state.y = newHeight - state.height;
          }
          
         // Refit text to card with new dimensions
         fitTextToCard(state.element);
       });

       lastWidth = newWidth;
       lastHeight = newHeight;
     }
    }

    // ============================================================================
    // Initialization (Phase 1-2)
    // ============================================================================

    /**
     * Create and insert game card elements, then initialize physics
     */
    function initializeGameCards() {
      GAMES.forEach((game, index) => {
        const cardElement = createGameCardElement(game);
        document.body.appendChild(cardElement);
      });

      // Wait for cards to be fully rendered before initializing physics
      setTimeout(() => {
        const cardElements = document.querySelectorAll('.game-card');
        cardElements.forEach((cardElement, index) => {
          // Fit text to card dimensions
          fitTextToCard(cardElement);
           
          // Initialize physics state
          initializeCardState(cardElement, index);
        });

        // Start animation loop
        animateCards();

        // Handle window resize
        window.addEventListener('resize', handleWindowResize);
      }, 50);
    }

    /**
     * Cleanup function - cancel animation and remove event listeners
     */
    function cleanup() {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }
      window.removeEventListener('resize', handleWindowResize);
    }

    // Initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', initializeGameCards);

    // Cleanup on page unload
    window.addEventListener('beforeunload', cleanup);
  </script>
</body>
</html>
