<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games - Jason Yu</title>
  <link rel="icon" type="image/x-icon" href="../img/favicon.ico" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* Game card container - positioned absolutely for DVD screensaver effect */
    .game-card {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
     width: 14vw;
     aspect-ratio: 4 / 3;
     min-width: 100px;
     min-height: 75px;
     padding: 0;
     transition: color 0.05s ease;
     will-change: transform, color;
     -webkit-font-smoothing: antialiased;
     -moz-osx-font-smoothing: grayscale;
    }

    /* Text inside cards scales to fit dimensions */
    .game-card h2 {
      font-weight: 700;
      margin: 0;
      padding: 0;
      line-height: 1;
      width: 100%;
      flex-shrink: 0;
      word-break: normal;
      overflow-wrap: normal;
      white-space: normal;
    }

    .game-card p {
      opacity: 0.85;
      margin: 0;
      padding: 0;
      line-height: 1.1;
      word-break: normal;
      overflow-wrap: normal;
      width: 100%;
      flex-shrink: 1;
    }

    /* Ensure no overflow - text is clipped if needed (shouldn't happen with proper sizing) */
    .game-card-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<body>
  <!-- Game cards will be inserted here by JavaScript -->

  <script>
    // ============================================================================
    // DVD Screensaver Games Page
    // ============================================================================
    // A single-file HTML page featuring a DVD screensaver-style animation where
    // game cards bounce around the viewport with dynamic color changes.
    //
    // Features:
    // - Bouncing cards with constant-velocity diagonal movement
    // - Random neon colors assigned to each card on initialization
    // - Color change on wall collisions (single-axis bounce)
    // - Rainbow flash effect on corner collisions (both-axes bounce)
    // - Responsive card sizing and viewport boundary adaptation
    // - Preserved click functionality to navigate to each game
    // - No external dependencies - pure vanilla JavaScript
    // - Smooth 60fps animation using requestAnimationFrame
    // ============================================================================

    // ============================================================================
    // Game Data - Extracted from original HTML
    // ============================================================================
    const GAMES = [
      {
        title: 'Blokus',
        subtitle: 'Classic abstract strategy board game with P2P multiplayer and AI',
        href: 'blokus/'
      },
      {
        title: 'Blokus Online',
        subtitle: 'Serverless WebRTC online multiplayer version of Blokus',
        href: 'blokus-online/'
      },
      {
        title: 'Carcassonne',
        subtitle: 'P2P online multiplayer version of the classic tile-placement board game',
        href: 'https://jasonycw.github.io/carcassonne/'
      },
      {
        title: 'Cube Shooter',
        subtitle: 'Survive waves of cubes in this fast-paced arcade shooter',
        href: 'cube-shooter/'
      },
      {
        title: 'CS DM',
        subtitle: 'Counter-Strike-inspired deathmatch hub with a static Pages-friendly shell',
        tags: ['deathmatch', 'fps', 'pages'],
        status: 'in-progress',
        href: 'cs-dm/'
      },
      {
        title: 'Fluid Go',
        subtitle: 'Experimental continuous-influence-field variant of Go',
        href: 'fluid-go/'
      },
      {
        title: 'Neon Orbit Defender',
        subtitle: 'Defend the power core from enemy shards in neon orbit',
        href: 'neon-orbit-defender/'
      },
      {
        title: 'Orbital Blitz',
        subtitle: 'Fast top-down survival shooter protecting a station ring',
        href: 'orbital-blitz/'
      },
      {
        title: 'Sky Jump',
        subtitle: 'Leap between floating islands and collect stars',
        href: 'sky-jump/'
      },
      {
        title: 'Tower Defense',
        subtitle: 'Place turrets and defend your base from enemy drones',
        href: 'tower-defense/'
      },
      {
        title: 'Typhoon Tycoon',
        subtitle: '2.5D tower defense — protect Hong Kong from typhoons using Li\'s Field defense system',
        href: 'typhoon-tycoon/'
      },
      {
        title: 'Typhoon Tycoon 2015',
        subtitle: 'Original 2015 prototype of the Typhoon Tycoon tower defense game',
        href: 'https://jasonycw.github.io/TyphoonTycoon/'
      },
      {
        title: 'Typhoon Tycoon (by Copilot CLI)',
        subtitle: '2.5D tower defense with Three.js - No build steps required!',
        href: 'typhoon-tycoon-by-copilot-cli/'
      },
      {
        title: 'Typhoon Tycoon (by OpenRouter)',
        subtitle: 'Try to recreate 2.5D version of https://jasonycw.github.io/TyphoonTycoon/',
        href: 'typhoon-tycoon-by-openrouter-free/'
      }
    ];

    // ============================================================================
    // Neon Color Palette
    // ============================================================================
    const NEON_COLORS = [
      '#00FFFF', // Cyan
      '#FF00FF', // Magenta
      '#00FF00', // Lime
      '#FFFF00', // Yellow
      '#FF0080', // Hot Pink
      '#00FF80', // Spring Green
      '#FF8000', // Orange
      '#0080FF'  // Dodger Blue
    ];

    const RAINBOW_COLORS = [
      '#FF0000', // Red
      '#FF7F00', // Orange
      '#FFFF00', // Yellow
      '#00FF00', // Green
      '#00FFFF', // Cyan
      '#FF00FF'  // Magenta
    ];

    // ============================================================================
    // Configuration Constants
    // ============================================================================
    const CONFIG = {
      TITLE_MAX_HEIGHT_PERCENT: 0.5,
      SUBTITLE_MAX_FONT_SIZE: 48,
      SUBTITLE_MAX_MULTIPLIER: 3,
      VELOCITY_MULTIPLIER: 1.5,
      MIN_VELOCITY: 0.5,
      RAINBOW_FLASH_INTERVAL: 10,
      COLOR_TRANSITION_TIME: '0.05s',
      TEXT_FIT_PRECISION: 12
    };

    // ============================================================================
    // Utility Functions
    // ============================================================================

    /**
     * Get a random color from the neon palette
     */
    function getRandomNeonColor() {
      return NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
    }

    /**
     * Create the HTML for a game card
     */
    function createGameCardElement(game) {
      const card = document.createElement('a');
      card.className = 'game-card';
      card.href = game.href;
      card.tabIndex = 0;
      card.setAttribute('aria-label', `${game.title}: ${game.subtitle}`);
      
      const content = document.createElement('div');
      content.className = 'game-card-content';
      
      const title = document.createElement('h2');
      title.textContent = game.title;
      
      const subtitle = document.createElement('p');
      subtitle.textContent = game.subtitle;
      
      content.appendChild(title);
      content.appendChild(subtitle);
      card.appendChild(content);
      
      return card;
    }

    /**
     * Fit text within card boundaries by adjusting font size
     * Uses binary search with reduced iterations for performance
     * 1. Title GROWS to fill card width completely (per card)
     * 2. Subtitle SHRINKS to fit remaining height (no minimum)
     */
    function fitTextToCard(cardElement) {
      const title = cardElement.querySelector('h2');
      const subtitle = cardElement.querySelector('p');
      
      if (!title || !subtitle) return;

      const cardHeight = cardElement.clientHeight;
      const cardWidth = cardElement.clientWidth;
      
      // Step 1: Binary search for maximum title font size
      // 12 iterations provide enough precision for the 1-200px range.
      let minFit = 1;
      let maxFit = 200;
      let bestFit = 1;
      
      for (let iter = 0; iter < 12; iter++) {
        const testSize = (minFit + maxFit) / 2;
        title.style.fontSize = testSize + 'px';
        
        // Single measurement pass (browser will batch layout)
        const titleHeight = title.offsetHeight;
        const titleClientWidth = title.clientWidth;
        const titleScrollWidth = title.scrollWidth;
        
        // Text fits if:
        // 1. All text fits within container width (scrollWidth <= clientWidth)
        // 2. Height doesn't exceed configured maximum
        const textFitsWidth = titleScrollWidth <= titleClientWidth + 1;
        const textFitsHeight = titleHeight <= cardHeight * CONFIG.TITLE_MAX_HEIGHT_PERCENT;
        
        if (textFitsWidth && textFitsHeight) {
          // Size works! Try larger
          bestFit = testSize;
          minFit = testSize;
        } else {
          // Doesn't fit, try smaller
          maxFit = testSize;
        }
      }
      
      // Apply best fitting title size (single browser layout)
      title.style.fontSize = bestFit + 'px';
      
      // Step 2: Calculate remaining space for subtitle
      const titleHeight = title.offsetHeight;
      const remainingHeight = cardHeight - titleHeight;
      
      // Step 3: Binary search for subtitle size
      // Reduced to 12 iterations for performance
      let subtitleMinFit = 1;
      let subtitleMaxFit = Math.min(remainingHeight * CONFIG.SUBTITLE_MAX_MULTIPLIER, CONFIG.SUBTITLE_MAX_FONT_SIZE);
      let subtitleBestFit = 1;
      
      for (let iter = 0; iter < 12; iter++) {
        const testSize = (subtitleMinFit + subtitleMaxFit) / 2;
        subtitle.style.fontSize = testSize + 'px';
        
        // Single measurement pass
        const subtitleHeight = subtitle.offsetHeight;
        const subtitleClientWidth = subtitle.clientWidth;
        const subtitleScrollWidth = subtitle.scrollWidth;
        
        // Subtitle must fit both vertically AND horizontally
        const subtitleFitsWidth = subtitleScrollWidth <= subtitleClientWidth + 1;
        const subtitleFitsHeight = subtitleHeight <= remainingHeight;
        
        if (subtitleFitsWidth && subtitleFitsHeight) {
          // Size works! Try larger
          subtitleBestFit = testSize;
          subtitleMinFit = testSize;
        } else {
          // Too big, try smaller
          subtitleMaxFit = testSize;
        }
      }
      
      // Apply final subtitle size
      subtitle.style.fontSize = subtitleBestFit + 'px';
    }

    // ============================================================================
    // Physics & Animation State Management
    // ============================================================================
    const cardStates = []; // Array of { element, x, y, vx, vy, color, isFlashing, rainbowIndex, width, height }
    let animationFrameId;
    let resizeFrameId = null;
    let lastWidth = window.innerWidth;
    let lastHeight = window.innerHeight;

    /**
     * Initialize a card with position, velocity, and color
     */
    function initializeCardState(cardElement, index) {
      const width = cardElement.offsetWidth;
      const height = cardElement.offsetHeight;
      
      // Generate velocity with minimum threshold to ensure visible movement
      let vx = (Math.random() - 0.5) * CONFIG.VELOCITY_MULTIPLIER + (Math.random() > 0.5 ? 1 : -1);
      let vy = (Math.random() - 0.5) * CONFIG.VELOCITY_MULTIPLIER + (Math.random() > 0.5 ? 1 : -1);
      
      // Ensure minimum velocity magnitude
      const velocityMagnitude = Math.sqrt(vx * vx + vy * vy);
      if (velocityMagnitude < CONFIG.MIN_VELOCITY) {
        const scale = CONFIG.MIN_VELOCITY / velocityMagnitude;
        vx *= scale;
        vy *= scale;
      }
      
      const state = {
        element: cardElement,
        x: Math.random() * (window.innerWidth - width),
        y: Math.random() * (window.innerHeight - height),
        vx: vx,
        vy: vy,
        color: getRandomNeonColor(),
        isFlashing: false,
        rainbowIndex: 0,
        rainbowCounter: 0,
        width: width,
        height: height
      };

      cardStates.push(state);
      applyCardStyle(state);
    }

    /**
     * Apply position and color styles to a card
     * Uses CSS transform for positioning to avoid layout reflows
     */
    function applyCardStyle(state) {
      // Use transform for better performance (avoids layout reflow)
      state.element.style.transform = `translate(${state.x}px, ${state.y}px)`;
      state.element.style.color = state.isFlashing 
        ? RAINBOW_COLORS[state.rainbowIndex]
        : state.color;
    }

    /**
     * Update card dimensions (for responsive resizing)
     */
    function updateCardDimensions(state) {
      state.width = state.element.offsetWidth;
      state.height = state.element.offsetHeight;
    }

    /**
     * Check and handle collisions with window boundaries
     * Detects wall hits, corner hits, and applies appropriate collision responses
     */
    function handleBoundaryCollision(state) {
      let hitXBoundary = false;
      let hitYBoundary = false;

      // Horizontal boundary check (left or right edge)
      if (state.x <= 0) {
        state.x = 0;
        state.vx = Math.abs(state.vx);
        hitXBoundary = true;
      } else if (state.x + state.width >= window.innerWidth) {
        state.x = window.innerWidth - state.width;
        state.vx = -Math.abs(state.vx);
        hitXBoundary = true;
      }

      // Vertical boundary check (top or bottom edge)
      if (state.y <= 0) {
        state.y = 0;
        state.vy = Math.abs(state.vy);
        hitYBoundary = true;
      } else if (state.y + state.height >= window.innerHeight) {
        state.y = window.innerHeight - state.height;
        state.vy = -Math.abs(state.vy);
        hitYBoundary = true;
      }

      // Determine collision type and apply effects
      if (hitXBoundary || hitYBoundary) {
        if (hitXBoundary && hitYBoundary) {
          // Corner hit - both X and Y boundaries hit in same frame
          state.isFlashing = true;
          state.rainbowIndex = 0;
          state.rainbowCounter = 0;
        } else {
          // Wall hit (not corner) - change to random neon color
          state.color = getRandomNeonColor();
          state.isFlashing = false;
        }
      }
    }

    /**
     * Update rainbow flash animation
     */
    function updateRainbowFlash(state) {
      if (state.isFlashing) {
        state.rainbowCounter++;
        if (state.rainbowCounter >= CONFIG.RAINBOW_FLASH_INTERVAL) {
          state.rainbowCounter = 0;
          state.rainbowIndex = (state.rainbowIndex + 1) % RAINBOW_COLORS.length;
          
          // Stop flashing after completing one full cycle
          if (state.rainbowIndex === 0) {
            state.isFlashing = false;
            state.color = getRandomNeonColor();
          }
        }
      }
    }

    /**
     * Animation loop - called every frame
     */
    function animateCards() {
      cardStates.forEach(state => {
        // Update position based on velocity
        state.x += state.vx;
        state.y += state.vy;

        // Handle boundary collisions
        handleBoundaryCollision(state);

        // Update rainbow flash if active
        updateRainbowFlash(state);

        // Apply styles
        applyCardStyle(state);
      });

      animationFrameId = requestAnimationFrame(animateCards);
    }

    // ============================================================================
    // Window Resize & Responsiveness
    // ============================================================================
    function handleWindowResize() {
      const newWidth = window.innerWidth;
      const newHeight = window.innerHeight;

      // Only update if dimensions actually changed
      if (newWidth !== lastWidth || newHeight !== lastHeight) {
        cardStates.forEach(state => {
          updateCardDimensions(state);
          
          // Clamp positions to new viewport
          if (state.x + state.width > newWidth) {
            state.x = newWidth - state.width;
          }
          if (state.y + state.height > newHeight) {
            state.y = newHeight - state.height;
          }
          
         // Refit text to card with new dimensions
         fitTextToCard(state.element);
       });

       lastWidth = newWidth;
       lastHeight = newHeight;
     }
    }
    
    /**
     * Debounce resize handler using requestAnimationFrame for smooth updates
     */
    function debouncedHandleWindowResize() {
      if (resizeFrameId !== null) {
        cancelAnimationFrame(resizeFrameId);
      }
      resizeFrameId = requestAnimationFrame(() => {
        handleWindowResize();
        resizeFrameId = null;
      });
    }

    // ============================================================================
    // Initialization (Phase 1-2)
    // ============================================================================

    /**
     * Create and insert game card elements, then initialize physics
     */
    function initializeGameCards() {
      GAMES.forEach((game, index) => {
        const cardElement = createGameCardElement(game);
        document.body.appendChild(cardElement);
      });

      // Use nested requestAnimationFrame for reliable DOM measurements
      // First frame allows browser to complete initial layout and paint
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const cardElements = document.querySelectorAll('.game-card');
          cardElements.forEach((cardElement, index) => {
            // Fit text to card dimensions
            fitTextToCard(cardElement);
             
            // Initialize physics state
            initializeCardState(cardElement, index);
          });

          // Start animation loop
          animateCards();

          // Handle window resize
          window.addEventListener('resize', debouncedHandleWindowResize);
        });
      });
    }

    /**
     * Cleanup function - cancel animation and remove event listeners
     */
    function cleanup() {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      if (resizeFrameId !== null) {
        cancelAnimationFrame(resizeFrameId);
        resizeFrameId = null;
      }
      window.removeEventListener('resize', debouncedHandleWindowResize);
      
      // Remove all game card elements from DOM
      cardStates.forEach(state => {
        if (state.element && state.element.parentNode) {
          state.element.parentNode.removeChild(state.element);
        }
      });
      cardStates.length = 0;
    }

    // Initialize when DOM is ready
    const initListener = initializeGameCards;
    document.addEventListener('DOMContentLoaded', initListener, { once: true });

    // Cleanup on page unload
    window.addEventListener('beforeunload', cleanup);
  </script>
</body>
</html>
