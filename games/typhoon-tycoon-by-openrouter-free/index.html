<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typhoon Tycoon</title>
    <link rel="icon" type="image/x-icon" href="../../img/favicon.ico" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="hud">
      <h1>Typhoon Tycoon</h1>
      <p>Score: <span id="score">0</span></p>
      <p>Resources: <span id="resources">100</span></p>
      <p>Health: <span id="health">100</span>%</p>
      <p>Wave: <span id="wave">1</span></p>
      <p class="hint">WASD / Arrow Keys to move cursor • Space / Click to place tower</p>
    </div>

    <div id="overlay">
      <div class="card">
        <h2>Defend the Island</h2>
        <p>
          Place towers to stop incoming typhoons before they reach your base.
        </p>
        <button id="startBtn" type="button">Start Defense</button>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
